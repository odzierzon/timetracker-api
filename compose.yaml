services:
  app:
    build: .
    working_dir: /app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: timetracker
      MYSQL_USER: timetracker
      MYSQL_PASSWORD: timetracker
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3306:3306"  
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  database_test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: timetracker_test
      MYSQL_USER: timetracker
      MYSQL_PASSWORD: timetracker
      MYSQL_ROOT_PASSWORD: test-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
  redis_data:
